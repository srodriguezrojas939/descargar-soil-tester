<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Descargar APP Sensor</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100%;
        background: transparent;
        font-family: "Oswald", "Arial Narrow", sans-serif;
        padding: 12px;
        overflow: hidden;
    }

    .app-download--hero {
        width: fit-content;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 0.9rem;
        padding: clamp(1.2rem, 3vw, 2.2rem) clamp(1rem, 4vw, 3rem);
        background: #EEE6FE;
        border: 1px solid rgba(53, 28, 117, 0.3);
        border-radius: 35px;
        box-shadow: 0 18px 50px rgba(53, 28, 117, 0.1);
    }

    .btn--primary.btn--xl {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: clamp(1rem, 2.5vw, 1.5rem) clamp(1.4rem, 5vw, 3.2rem);
        background: #C2ACFC;
        color: #351C75;
        font-family: "Oswald", "Arial Narrow", sans-serif;
        font-size: clamp(0.9rem, 2.2vw, 1.3rem);
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        white-space: normal;
        text-align: center;
        max-width: 100%;
        border: 1px solid transparent;
        border-radius: 22px;
        transition: background 0.25s cubic-bezier(0.22, 0.61, 0.36, 1), color 0.25s cubic-bezier(0.22, 0.61, 0.36, 1), transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .btn--primary.btn--xl svg {
        flex: none;
        width: clamp(30px, 6vw, 48px);
        height: clamp(30px, 6vw, 48px);
        transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .btn--primary.btn--xl:hover {
        background: #351C75;
        color: #FBF4EC;
    }

    .btn--primary.btn--xl:hover svg {
        transform: translateX(4px);
    }

    .app-download__meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: clamp(0.62rem, 1.8vw, 0.78rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6F6594;
        max-width: 100%;
    }
</style>
</head>
<body>

    <div class="app-download--hero">
        <a class="btn--primary btn--xl" href="Soil_Detector_1.0.1.apk" download="Soil_Detector_1.0.1.apk">
            <i data-lucide="download" aria-hidden="true"></i>
            Descargar APP sensor
        </a>
        <p class="app-download__meta">Soil Detector 1.0.1 · Android · 10,6 MB</p>
    </div>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
